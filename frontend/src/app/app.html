@if (authService.isAuthenticated()) {
  <nav class="topbar">
    <div class="topbar-izquierda">
      <span class="brand">SIGAC</span>
      <a routerLink="/socios" routerLinkActive="activo">Socios</a>
      <a routerLink="/puestos" routerLinkActive="activo">Puestos</a>
      <a routerLink="/giros" routerLinkActive="activo">Giros</a>
      <a routerLink="/bancos" routerLinkActive="activo">Bancos</a>
      <a routerLink="/servicios" routerLinkActive="activo">Servicios</a>
      <a routerLink="/cuentas-por-cobrar" routerLinkActive="activo">Cuentas por cobrar</a>
      <a routerLink="/cobranza" routerLinkActive="activo">Cobranza</a>
      <a routerLink="/recibos" routerLinkActive="activo">Recibos</a>
      <a routerLink="/egresos" routerLinkActive="activo">Egresos</a>
      <a routerLink="/reportes" routerLinkActive="activo">Reportes</a>
    </div>
    <div class="topbar-usuario">
      <span class="usuario-info">
        {{ authService.username() }} <span class="rol-badge">{{ authService.rol() }}</span>
      </span>
      <button type="button" class="btn btn-secondary" (click)="logout()">Cerrar sesión</button>
    </div>
  </nav>
}

<router-outlet></router-outlet>
<app-toast></app-toast>
