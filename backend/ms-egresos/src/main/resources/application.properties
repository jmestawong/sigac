spring.application.name=ms-egresos
server.port=${SERVER_PORT:8084}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:5510}/${DB_NAME:sigac_egresos}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
