spring.application.name=ms-cobranza
server.port=${SERVER_PORT:8082}

# ---------------------------------------------------------------------------
# Base de datos propia del servicio (cuentas por cobrar y recibos)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:5510}/${DB_NAME:sigac_cobranza}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: la misma clave en todos los microservicios
sigac.security.jwt.secret=${JWT_SECRET:EZ8HgNtU/HNryDDLFKmXbm9JfL9K027pzTXOFwMY47sia4+Y0HQIn4EidDuGWWDS}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# OpenFeign: tiempos de espera hacia ms-catalogos
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# RabbitMQ (docker-compose de la carpeta queue/): auditoria asincrona
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
sigac.auditoria.habilitada=${AUDITORIA_HABILITADA:true}
