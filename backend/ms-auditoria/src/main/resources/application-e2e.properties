# Perfil "e2e": H2 en memoria. Los productores no publican en e2e, asi que no se necesita RabbitMQ:
# el consumidor no arranca para no insistir en conectarse a un broker que no existe.
spring.datasource.url=jdbc:h2:mem:ms_auditoria_e2e;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.rabbitmq.listener.simple.auto-startup=false
