# Perfil "dev": H2 en archivo local, sin necesidad de MySQL (RabbitMQ sigue siendo necesario para recibir eventos).
# Uso: ./mvnw spring-boot:run -pl ms-auditoria -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:file:./data/ms-auditoria-dev;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
