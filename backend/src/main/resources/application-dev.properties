# ---------------------------------------------------------------------------
# Perfil "dev": base de datos H2 en archivo local, para levantar el backend
# sin necesidad de instalar/configurar MySQL (util para desarrollo del
# frontend o demos rapidas).
#
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Consola H2 disponible en http://localhost:8080/h2-console (JDBC URL abajo)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/sigac-dev;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

server.port=${SERVER_PORT:8080}
