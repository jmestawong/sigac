# ---------------------------------------------------------------------------
# Perfil "e2e": base de datos H2 en memoria, se reinicia limpia cada vez que
# arranca el backend. Pensado para que Playwright levante un backend
# desechable y reproducible sin depender de MySQL ni de datos previos.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:sigac_e2e;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=${SERVER_PORT:8081}
