# ---------------------------------------------------------------------------
# Perfil de migracion a PostgreSQL (aun no activo).
#
# Pasos para activarlo:
#   1. Agregar la dependencia en pom.xml:
#        <dependency>
#          <groupId>org.postgresql</groupId>
#          <artifactId>postgresql</artifactId>
#          <scope>runtime</scope>
#        </dependency>
#   2. Levantar la app con: --spring.profiles.active=postgres
#      (o SPRING_PROFILES_ACTIVE=postgres)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sigac_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
